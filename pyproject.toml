[project]
name = "cybot"
version = "0.1.0"
description = "Scope-gated bug bounty reconnaissance agent for Fly.io Sprites."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sambo Flourish" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "cryptography>=43",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cybot = "cybot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cybot = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
